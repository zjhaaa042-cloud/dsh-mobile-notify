# DSH 手机通知插件（mobile-notify）的 bundle 声明与默认配置。
#
# 安装后所有字段都可以在 config 里覆盖，只写你要改的项即可；
# 完整字段说明见 docs/configuration.md，各渠道怎么拿凭据见 docs/channels.md。
#
# ⚠️ 这份工作副本里 ntfyTopic 是本机真实主题；GitHub 仓库里对应位置是占位符
#    'CHANGE-ME-random-topic'。改主题/密钥前后别把工作副本提交上去，
#    可以 `git update-index --skip-worktree cordis.patch.yml`（见 docs/configuration.md）。
- insert:
    - id: mobile-notify
      name: 'dsh-mobile-notify'
      config:
        enabled: true
        channel: ntfy
        ntfyServer: 'https://ntfy.sh'
        ntfyTopic: 'CHANGE-ME-random-topic'
        trigger: idle
        notifyOn: all
        includeSubagents: false
        includePreview: true
        previewMaxChars: 200
        minTurnDurationMs: 0
        timeoutMs: 10000
        dryRun: false
        logPayload: false
